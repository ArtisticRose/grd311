<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Landing Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            padding: 0%;
            width: 100%;
            font-family: "Bebas Neue";
            letter-spacing: 1px; 
        }

        .hero {
            width: 100%;
            height: 100vh;
            background-image:
                url("img/hero_background.png.png");
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
        }

        .navbar {
            display: flex;
            align-items: center;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            margin-left: 60px;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
            padding-right: 30px;
            margin-left: auto;
        }

        .info {
            position: absolute;
            left:2%;
            bottom: 8%;
        }

        .year {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 2px;
        }

         .info h2 {
            font-size: 48px;
            margin: 0;
        }

        .price {
            font-size: 26px;
            font-weight: bold;
            margin: 4px 0 4px;
        }

        .details {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 50px;
            text-decoration-line: underline;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .buttons a {
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
        }

        .button-one {
            background-color: white;
            color: #222;
        }

        .button-two {
            border: 2px solid white;
            color: white;
        }

    </style>

</head>

<body>

    <header class="hero">

        <nav class="navbar">

            <div>

                <img src="img/FordOval.svg.png" alt="Ford Logo Oval" style="padding-left: 30px; padding-top: 30px;">

            </div>

            <div class="nav-links" style="padding-top: 30px;">

                <a href="empty">Vehicles</a>
                <a href="empty">Shop</a>
                <a href="empty">Support & Service</a>
                <a href="empty">Ford Pro Solutions</a>

            </div>

            <div class="nav-icons" style="padding-top: 30px;">

                <a href="empty"> <img src="img/search-v2-white.png" alt="Search Icon"></a>
                <a href="empty"><img src="img/location-outline-v2-white.png" alt="Map/ Location Icon"> LOCATE DEALER</a>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"><img src="img/account-outline-v2-white.png" alt="Person Icon"></a>
                <a href="empty"><img src="img/globe-v2-white.png" alt="Globe Icon"></a>
                
            </div>

        </nav>

        <div class="info">

            <p class="year">

                2026

            </p>

            <h2>ESCAPE<sup>®</sup></h2>

            <p class="price">

                STARTING AT $30,350<sup>1</sup>

            </p>

            <p class="details">

                DETAILS
            
            </p>

            <div class="buttons">
                
                <a href="empty" class="button-one">

                    SEARCH INVENTORY

                </a>

                <a href="empty" class="button-two">

                    2026 ESCAPE

                </a>

            </div>

        </div>

    </header>

</body>

</html>
